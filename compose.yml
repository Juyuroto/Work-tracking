name: work-tracking

services:
  backend:
    build: ./backend
    restart: unless-stopped
    # aucun port publié : seul le frontend l'appelle, par le réseau Compose
    volumes:
      - app_data:/data
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3000:3000"
    environment:
      API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(function(r){process.exit(r.status<500?0:1)}).catch(function(){process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  app_data:
